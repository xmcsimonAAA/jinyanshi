<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>金岩石官网 · 内容管理后台</title>
        <link rel="stylesheet" href="css/admin.css?v=LANGv8">
  <style>
    /* 防止登录页首帧高度抖动：先把 body 最小高锁死 */
    body { min-height: 100vh; margin: 0; }
    html { scroll-behavior: auto; }
  </style>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div id="loginView" class="login-view">
        <div class="login-bg"></div>
        <div class="login-card">
            <div class="login-logo">
                <div class="login-logo-header" id="loginLogoHeaderWrap"></div>
            </div>
            <h1 class="login-title">内容管理后台</h1>
            <p class="login-subtitle">CMS Admin Dashboard</p>
            <form id="loginForm" class="login-form">
                <label class="field">
                    <span class="field-label">管理员密码</span>
                    <div class="field-input-wrap">
                        <svg class="field-icon" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="10" width="14" height="8" rx="2"/><path d="M7 10V7a3 3 0 016 0v3"/></svg>
                        <input id="loginPwd" type="password" placeholder="请输入登录密码" autocomplete="current-password" required>
                    </div>
                </label>
                <div id="loginError" class="login-error" style="display:none;">密码错误，请重试。</div>
                <button type="submit" class="btn btn-primary btn-full">登 录</button>
                <p class="login-hint">请联系系统管理员获取登录权限。如忘记密码，可通过系统管理员重置。</p>
            </form>
        </div>
    </div>

    <div id="adminView" class="admin-view" style="display:none;">
        <div id="sidebarMask" class="sidebar-mask"></div>
        <aside class="admin-sidebar">
            <div class="admin-brand">
                <div class="admin-brand-icon" id="sidebarBrandIconWrap">
                    <svg viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path fill="currentColor" d="M143.8 52.2c-8.6-6.5-19.8-10.2-32.5-10.2C73.5 42 40 71.8 40 109.3c0 21.6 12.3 40.4 30.6 49.7 7.3 3.7 15.6 5.7 24.2 5.7 4.2 0 8.3-0.5 12.2-1.4 7-1.7 13.1-4.9 18-9.1 3.9-3.4 7-7.5 9.1-12.2 2.3-5.4 2.1-11.4-1.1-16.7-3.4-5.5-9-9.2-16.2-10.9-2.8-0.7-5.7-0.6-8.7 0-2.5 0.5-4.5 2.1-5.9 4.2-0.8 1.2-2.1 1.8-3.5 1.8-3.1 0-5.5-2.7-5.5-6 0-1.3 0.5-2.6 1.3-3.6 3.1-3.8 7.3-6.7 12.3-8.3 10.1-3.3 26-4.8 42.5 1.5 3.3 1.2 5.8 4 6.5 7.4 0.3 1.1 1.9 0.8 1.9 0 1.3-18.4-3.8-36.4-13.8-50.3z"/>
                    </svg>
                </div>
                <div class="admin-brand-text">
                    <div class="admin-brand-en" style="font-family:Inter,Arial,sans-serif;font-weight:800;"><span class="brand-en-golden">GOLDEN</span> CMS</div>
                    <div class="admin-brand-cn">金岩石 后台</div>
                </div>
            </div>
            <nav class="admin-nav">
                <ul id="adminNav"></ul>
            </nav>
            <div class="admin-sidebar-footer">
                <button id="previewBtn" class="admin-btn-preview">
                    <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M10 3C6 3 2.73 5.11 1 7c1.73 1.89 5 4 9 4s7.27-2.11 9-4c-1.73-1.89-5-4-9-4z"/><circle cx="10" cy="7" r="3"/><path d="M1.75 13.5C5.5 16 8.5 17 10 17s4.5-1 8.25-3.5"/></svg>
                    打开官网预览
                </button>
                <button id="logoutBtn" class="admin-btn-ghost">
                    <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M7 4H5a2 2 0 00-2 2v8a2 2 0 002 2h2"/><path d="M14 10H4m0 0l3-3m-3 3l3 3m7-9l3 12"/></svg>
                    退出登录
                </button>
            </div>
        </aside>

        <div class="admin-main">
            <header class="admin-header">
                <button id="sidebarToggle" class="sidebar-toggle" type="button" aria-label="切换导航菜单" aria-expanded="false">
                    <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="2.5" y1="5" x2="17.5" y2="5"/>
                        <line x1="2.5" y1="10" x2="17.5" y2="10"/>
                        <line x1="2.5" y1="15" x2="17.5" y2="15"/>
                    </svg>
                </button>
                <div class="admin-header-left">
                    <h2 id="pageTitle" class="admin-page-title">站点设置</h2>
                    <span class="admin-header-desc" id="pageDesc">修改网站标题、关键词、品牌名称等基础信息</span>
                </div>
                <div class="admin-header-right">
                    <label class="admin-lang-control" title="选择要编辑的语言">
                        <span>编辑语言</span>
                        <select id="adminLangSelect">
                            <option value="zh_CN">简体中文</option>
                            <option value="zh_TW">繁體中文</option>
                            <option value="en">English</option>
                        </select>
                    </label>
                    <div id="saveStatus" class="save-status">未保存更改</div>
                    <button id="resetBtn" class="admin-btn-outline">恢复默认</button>
                    <button id="saveBtn" class="admin-btn-primary">
                        <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h9l3 3v9a1 1 0 01-1 1H4a1 1 0 01-1-1V5a1 1 0 011-1z"/><path d="M14 4v4H6V4h8z"/></svg>
                        保存更改
                    </button>
                </div>
            </header>

            <div class="admin-body">
                <div id="toastContainer" class="toast-container"></div>
                <div id="formContainer" class="form-container">
                    <!-- 表单由 JS 动态生成 -->
                </div>
            </div>
        </div>
    </div>

    <script src="/api/config.js?v=LANGv14"></script>
    <script src="config.js?v=LANGv14"></script>
    <script src="js/i18n.js?v=LANGv14"></script>
    <script src="js/admin.js?v=LANGv14"></script>

    <!-- 图片裁剪弹窗 -->
    <div id="cropModal" class="crop-modal" style="display:none;">
        <div class="crop-modal-mask"></div>
        <div class="crop-modal-card">
            <div class="crop-modal-header">
                <h3 class="crop-modal-title">调整 Logo 尺寸</h3>
                <button type="button" class="crop-modal-close" id="cropCloseBtn" aria-label="关闭">
                    <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                        <line x1="4" y1="4" x2="16" y2="16"/><line x1="16" y1="4" x2="4" y2="16"/>
                    </svg>
                </button>
            </div>
            <div class="crop-modal-body">
                <div class="crop-stage" id="cropStage">
                    <img id="cropSource" alt="上传图片预览" draggable="false">
                    <div class="crop-mask-top"></div>
                    <div class="crop-mask-bottom"></div>
                    <div class="crop-mask-left"></div>
                    <div class="crop-mask-right"></div>
                    <div class="crop-box" id="cropBox">
                        <div class="crop-grid-horiz crop-grid-1"></div>
                        <div class="crop-grid-horiz crop-grid-2"></div>
                        <div class="crop-grid-vert crop-grid-1"></div>
                        <div class="crop-grid-vert crop-grid-2"></div>
                        <span class="crop-handle nw" data-dir="nw"></span>
                        <span class="crop-handle n" data-dir="n"></span>
                        <span class="crop-handle ne" data-dir="ne"></span>
                        <span class="crop-handle w" data-dir="w"></span>
                        <span class="crop-handle e" data-dir="e"></span>
                        <span class="crop-handle sw" data-dir="sw"></span>
                        <span class="crop-handle s" data-dir="s"></span>
                        <span class="crop-handle se" data-dir="se"></span>
                    </div>
                </div>
                <div class="crop-controls">
                    <div class="crop-controls-row">
                        <div class="crop-control">
                            <label>宽高比</label>
                            <div class="crop-aspect-row">
                                <button type="button" class="chip-btn" data-aspect="free">自由</button>
                                <button type="button" class="chip-btn" data-aspect="header">Header (240:44)</button>
                                <button type="button" class="chip-btn" data-aspect="footer">Footer (16:3)</button>
                                <button type="button" class="chip-btn" data-aspect="square">方形 (1:1)</button>
                                <button type="button" class="chip-btn" data-aspect="login">登录 (25:4)</button>
                            </div>
                        </div>
                    </div>
                    <div class="crop-controls-row">
                        <div class="crop-control">
                            <label>尺寸缩放</label>
                            <div class="crop-slider-wrap">
                                <input type="range" id="cropScale" min="10" max="300" value="100">
                                <span id="cropScaleLabel">100%</span>
                            </div>
                        </div>
                        <div class="crop-control">
                            <label>输出格式</label>
                            <select id="cropFormat">
                                <option value="image/png">PNG（透明推荐）</option>
                                <option value="image/svg+xml" disabled>SVG（需原文件为 SVG）</option>
                                <option value="image/jpeg">JPEG（体积最小）</option>
                            </select>
                        </div>
                    </div>
                    <div class="crop-controls-row crop-info-row">
                        <div class="crop-info" id="cropInfo">选框：— × —　原图：— × —</div>
                        <div class="crop-output" id="cropOutputInfo">输出：— × —</div>
                    </div>
                </div>
            </div>
            <div class="crop-modal-footer">
                <button type="button" class="admin-btn-outline" id="cropCancelBtn">取消</button>
                <button type="button" class="admin-btn-primary" id="cropConfirmBtn">
                    <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M4 12l3 3 9-9"/>
                    </svg>
                    确认裁剪
                </button>
            </div>
        </div>
    </div>
</body>
</html>
